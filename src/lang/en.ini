[Help]
Title=How to use
Body=Getting started\n\n1. The program appears in the Windows tray when started.\n\n2. Hikimori Neko is the built-in profile.\n\n3. To add another channel, select Add profile and enter its CHZZK LIVE URL.\n\n4. The app displays an alert when a registered channel starts streaming.\n\n5. Click an alert to open the live page.\n\n6. Turn notifications on or off for each profile.\n\n7. Closing or minimizing the window keeps the app running in the tray.\n\n8. To exit, right-click the tray icon and select Exit.\n\n9. Settings controls startup and notification sound.
