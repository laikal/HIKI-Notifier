[Help]
Title=使い方
Body=基本的な使い方\n\n1. Hikimori NekoのCHZZKとYouTubeチャンネルが内蔵されています。\n\n2. 配信者名、メモ、CHZZK / RPLAY / YouTube / Twitch / SOOP / CIME のチャンネルURLを追加してください。\n\n3. CHZZK、RPLAY、Twitch、SOOP、CIMEは配信開始を通知し、YouTubeは新着コンテンツを通知します。\n\n4. 通知ウィンドウの表示ボタンを押すと該当ページを開きます。\n\n5. チャンネルごとの通知設定は一覧またはトレイから変更できます。\n\n6. ウィンドウを閉じてもトレイで動作を続けます。

