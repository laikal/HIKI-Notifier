[Help]
Title=How to use
Body=Getting started\n\n1. Hikimori Neko includes CHZZK and YouTube channels.\n\n2. Add a streamer name, memo, and CHZZK, RPLAY, or YouTube channel URL.\n\n3. CHZZK and RPLAY report live starts; YouTube reports new content.\n\n4. Use the button in an alert to open the relevant page.\n\n5. Toggle alerts per channel in the list or tray.\n\n6. Closing the window keeps the app running in the tray.
