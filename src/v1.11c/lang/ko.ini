[Help]
Title=사용 방법
Body=기본 사용법\n\n1. Hikimori Neko에는 CHZZK와 YouTube 채널이 내장되어 있습니다.\n\n2. 스트리머 이름, 메모, CHZZK / RPLAY / YouTube 채널 주소를 추가하세요.\n\n3. CHZZK와 RPLAY는 방송 시작, YouTube는 새 콘텐츠를 알려드립니다.\n\n4. 알림창의 보기 버튼을 눌러 해당 페이지를 엽니다.\n\n5. 채널별 알림은 목록 또는 트레이에서 변경할 수 있습니다.\n\n6. 창을 닫아도 트레이에서 계속 실행됩니다.
